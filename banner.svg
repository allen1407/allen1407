<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" width="1400" height="460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b17"/>
      <stop offset="1" stop-color="#0e1433"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ee7ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#5ee7ff" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="floor"><rect x="0" y="330" width="1400" height="130"/></clipPath>
  </defs>

  <rect width="1400" height="460" rx="18" fill="url(#bg)"/>
  <rect width="1400" height="460" rx="18" fill="url(#glow)"/>

  <!-- perspective floor -->
  <g clip-path="url(#floor)" stroke="url(#fade)" stroke-width="1.2" fill="none">
    <path d="M0 340H1400M0 356H1400M0 380H1400M0 414H1400M0 458H1400"/>
    <path d="M700 330L700 460M700 330L520 460M700 330L340 460M700 330L160 460M700 330L-20 460M700 330L880 460M700 330L1060 460M700 330L1240 460M700 330L1420 460"/>
  </g>
  <line x1="0" y1="330" x2="1400" y2="330" stroke="#5ee7ff" stroke-opacity="0.35"/>

  <!-- wireframe cube with orbiting rings -->
  <g transform="translate(1080 190)">
    <g fill="none" stroke="#5ee7ff" stroke-width="1.6" stroke-linejoin="round">
      <path d="M0 -78 L68 -39 L68 39 L0 78 L-68 39 L-68 -39 Z" stroke-opacity="0.9"/>
      <path d="M0 0 L0 78 M0 0 L68 -39 M0 0 L-68 -39" stroke-opacity="0.9"/>
      <path d="M0 -78 L0 0 M68 39 L0 0 M-68 39 L0 0" stroke-opacity="0.18" stroke-dasharray="4 5"/>
    </g>
    <g fill="#5ee7ff">
      <circle cx="0" cy="-78" r="3.5"/><circle cx="68" cy="-39" r="3.5"/><circle cx="68" cy="39" r="3.5"/>
      <circle cx="0" cy="78" r="3.5"/><circle cx="-68" cy="39" r="3.5"/><circle cx="-68" cy="-39" r="3.5"/>
      <circle cx="0" cy="0" r="3.5"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="1080 190;1080 178;1080 190" dur="6s" repeatCount="indefinite"/>
  </g>
  <g transform="rotate(-18 1080 190)">
    <ellipse cx="1080" cy="190" rx="170" ry="52" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.55"/>
    <circle r="6" fill="#a78bfa">
      <animateMotion dur="7s" repeatCount="indefinite" path="M910 190 A170 52 0 1 0 1250 190 A170 52 0 1 0 910 190"/>
    </circle>
  </g>
  <g transform="rotate(24 1080 190)">
    <ellipse cx="1080" cy="190" rx="140" ry="40" fill="none" stroke="#5ee7ff" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle r="4.5" fill="#5ee7ff">
      <animateMotion dur="5s" repeatCount="indefinite" path="M1220 190 A140 40 0 1 1 940 190 A140 40 0 1 1 1220 190"/>
    </circle>
  </g>
  <ellipse cx="1080" cy="352" rx="110" ry="10" fill="#5ee7ff" opacity="0.12"/>

  <!-- left copy -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="90" y="78" width="330" height="36" rx="18" fill="#5ee7ff" fill-opacity="0.08" stroke="#5ee7ff" stroke-opacity="0.5"/>
    <circle cx="114" cy="96" r="5" fill="#5ee7ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="130" y="102" fill="#bdf6ff" font-size="17" font-weight="600">AI · XR · SPATIAL COMPUTING</text>

    <text x="86" y="200" fill="url(#name)" font-size="86" font-weight="800">Allen Peter</text>
    <text x="90" y="248" fill="#c7d2fe" font-size="25">Building talking 3D avatars, Indic lip-sync</text>
    <text x="90" y="282" fill="#c7d2fe" font-size="25">and WebAR that runs straight from a browser.</text>
  </g>
</svg>
